<!-- templates/makeimage.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        form {
            max-width: 500px;
            margin: 20px 0;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Выводим сообщение об ошибке, если есть -->
    {% if message %}
        <div class="error">{{ message }}</div>
    {% endif %}

    <h1>Generate Image</h1>
    <form method="post" enctype="application/x-www-form-urlencoded">
        <label for="width">Width (px):</label>
        <input type="number" id="width" name="width" value="{{ width }}" required>

        <label for="height">Height (px):</label>
        <input type="number" id="height" name="height" value="{{ height }}" required>

        <label for="text">Prompt:</label>
        <input type="text" id="text" name="text" value="{{ text }}" required>

        <input type="submit" value="Generate">
    </form>

</body>
</html>
